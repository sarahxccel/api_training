name: CI Workflow with Secrets

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      # Map GitHub secrets to Terraform variables
      TF_VAR_project: ${{ secrets.GCP_PROJECT }}
      TF_VAR_location: ${{ secrets.GCP_LOCATION }}
      TF_VAR_database_name: ${{ secrets.DATABASE_NAME }}
      TF_VAR_database_user: ${{ secrets.DATABASE_USER }}
      TF_VAR_db_password: ${{ secrets.DATABASE_PASSWORD }}
      TF_VAR_instance_connection_name: ${{ secrets.DATABASE_INSTANCE_CONNECTION_NAME }}
      TF_VAR_docker_registry: ${{ secrets.DOCKER_REGISTRY }}

        # Plain versions for Docker steps
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}

    steps:
      # 1️⃣ Checkout the repository so workflow can access your code
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Lint with ruff and black
        run: |
          black --check .
          ruff check .

      # 2️⃣ Authenticate with Google Cloud using your GitHub secret
      - name: Set up Google Cloud authentication
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # 3️⃣ Terraform section
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform -chdir=terraform init

      # - name: Github Terraform Destroy
      #   run: terraform -chdir=terraform destroy -auto-approve

      - name: Terraform Plan
        env:
          TF_VAR_deletion_protection: "false"
        run: terraform -chdir=terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform -chdir=terraform apply -auto-approve tfplan


      # Optional: configure Docker for GCP if you need to build/push images
      - name: Authenticate Docker with Artifact Registry
        run: gcloud auth print-access-token | docker login europe-west4-docker.pkg.dev --username oauth2accesstoken --password-stdin
        shell: bash

      - name: Build Docker for GCP
        run: docker build -t ${GCP_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/${DOCKER_REGISTRY}/sarahs-image:latest .
        shell: bash

      - name: Push Docker for GCP
        run: docker push ${GCP_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/${DOCKER_REGISTRY}/sarahs-image:latest
        shell: bash

          # - name: Cloud run api
      #   run: |
      #     gcloud run deploy sarahs-api \
      #       --image=europe-west4-docker.pkg.dev/ae-terraform-2025/ae-2025-registry/sarahs-image:latest \
      #       --region=europe-west4 \
      #       --platform=managed \
      #       --allow-unauthenticated \
      #       --set-env-vars INSTANCE_CONNECTION_NAME="ae-terraform-2025:europe-west4:sarahs-db",DATABASE_NAME="mydatabase",DATABASE_USER="dbuser",DATABASE_PASSWORD=${{env.TF_VAR_db_password}} \
      #       --vpc-connector=serverless-connector \
      #   shell: bash