[project]
name = "api_training"
version = "0.1.0"
description = "A FastAPI project to use roman numeral converter"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "psycopg2-binary",
    "sqlalchemy",
    "roman_converter@git+https://github.com/sarahxccel/roman_converter.git"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
    "httpx"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D203", "D213"]